# mangoWM conf by maslo_kaput|
# ////////////////////////////
# AUTOSTART
exec=pkill swaybg; sleep 1 && swaybg -i /home/maslo/CatppuccinMango/wallpapers/lain.jpeg -m fill
exec=pkill waybar; sleep 1 && waybar
exec=mako

# effects and look
borderpx=2
bordercolor=0x313244ff
focuscolor=0x89b4faff
urgentcolor=0xf38ba8ff
rootcolor=0x1e1e2eff

# gaps
gappih=8
gappiv=8
gappoh=12
gappov=12

# rounding and opacity
border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.90

# blur
blur=1
blur_layer=1
blur_params_radius=7

# animations
animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_open=200
animation_duration_close=18

#default layout
default_layout=grid

# keyboard and mouse
repeat_rate=25
repeat_delay=600
xkb_rules_layout=pl
sloppyfocus=1
warpcursor=1

#////////////////keybinds
# config reload
bind=SUPER+SHIFT,r,reload_config

#screenlock
bind=SUPER,l,spawn,swaylock --screenshots --clock --indicator --effect-blur 7x5 --effect-vignette 0.5:0.5 --ring-color 89b4fa --inside-color 1e1e2e88

# apps
#kitty
bind=SUPER,q,spawn,kitty
bind=ALT,t,spawn,kitty
#rofi
bind=SUPER,a,spawn,rofi -show drun
bind=SUPER,TAB,spawn,rofi -show drun
#screenshots
bind=SUPER+SHIFT,s,spawn,sh -c "grim -g \"$(slurp)\" - | wl-copy"
bind=Print,spawn,sh -c "grim -g \"$(slurp)\" - | wl-copy"
#app drawer
bind=SUPER,e,spawn,yazi
#bind list
bind=SUPER+SHIFT,+,spawn,~/.local/bin/show-keybinds.sh

#window closing
bind=SUPER,c,killclient
#mangowm shutdown
bind=SUPER,m,quit

#moving over windows
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

#changing window position
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

#workspaces
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

#mowing window on workspace
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

#window modes
bind=SUPER,f,togglefullscreen
bind=SUPER,space,togglefloating
bind=ALT,tab,enteroverview

#size and position of floating windows
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

#else
layer_rule=animation slide,rofi
layer_rule=blur,rofi
